<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>better</title>

    <!-- PWA / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="better" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fcfaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="vapid-public-key" content="BBKAzwVz_qcw8KYcJ88wJdeW9z62Ev3ZRhSJ5Pm0XKteb0_fVHC_Z4I8jxjmPf3cjabQKp_oTOxxWYJ2Y_dmEMY" />

    <script>
      /* Blocking on purpose: without it every dark-mode load flashes white
         while React boots. Mirrors resolveTheme() in src/hooks/useTheme.ts. */
      (function () {
        var stored = localStorage.getItem('better:theme')
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
