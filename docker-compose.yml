services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: better
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: better
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U better -d better"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Exposed for local `psql`/drizzle-kit access during development only;
      # remove this mapping for a production deploy that has no need to
      # reach Postgres from outside the compose network.
      - '127.0.0.1:5432:5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://better:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/better
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      # S3-compatible storage (storage spec §5) — optional; bare names below
      # are omitted from the container entirely when unset in .env, matching
      # config.ts's z.string().optional() (an empty string would fail it).
      - S3_ENDPOINT
      - S3_REGION
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_BUCKET

volumes:
  postgres-data:
